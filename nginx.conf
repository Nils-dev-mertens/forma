# Forma reverse proxy
#
# Single front door that routes:
#   /                -> Astro landing page   (apps/web,  port 3005)
#   /dashboard       -> TanStack dashboard    (apps/dashboard, port 3002)
#   /api, /api-docs, /set-images, /profile-logos, /tempphotos
#                    -> Express API          (apps/api, port 3001)
#
# Run the apps with `bun run dev` (turbo starts api + dashboard + web), then
# start nginx, e.g.:  nginx -c $(pwd)/nginx.conf -p $(pwd)
# The gateway listens on port 3000 (the conventional frontend port).

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # ---- Upstreams -----------------------------------------------------------
  upstream landing   { server 127.0.0.1:3005; }   # Astro landing
  upstream dashboard { server 127.0.0.1:3000; }   # TanStack dashboard
  upstream api       { server 127.0.0.1:3002; }   # Express API (3001 if docker isn't using it)

  # ---- Shared proxy settings ----------------------------------------------
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  server {
    listen 8080;
    server_name _;

    # ---- Dashboard (TanStack Start, mounted at /dashboard) -----------------
    # proxy_pass WITHOUT a path preserves the full original URI, so
    # /dashboard/login is forwarded as /dashboard/login to the upstream
    # (whose Vite base is /dashboard/).
    location = /dashboard {
      return 302 /dashboard/;
    }

    location /dashboard/ {
      # WebSocket upgrade for Vite HMR in development.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://dashboard;
    }

    # ---- API ---------------------------------------------------------------
    location /api/         { proxy_pass http://api; }
    location /api          { proxy_pass http://api; }
    location /api-docs/    { proxy_pass http://api; }
    location /api-docs     { proxy_pass http://api; }
    location /set-images/  { proxy_pass http://api; }
    location /profile-logos/ { proxy_pass http://api; }
    location /tempphotos/  { proxy_pass http://api; }

    # ---- Landing page (Astro) ---------------------------------------------
    location / {
      proxy_pass http://landing;
    }
  }
}
